steps:
  # 1. Build using Buildpacks and tag it explicitly as 'latest' (lowercase)
  - name: 'gcr.io/k8s-skaffold/pack'
    args: 
      - 'build'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-builder:latest'
      - '--builder'
      - 'gcr.io/buildpacks/builder:v1'

  # 2. Tag the exact same image with the capitalized repo name just in case
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'tag'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-builder:latest'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/Resume-Builder:latest'

images:
  # This forces Cloud Build to physically push the images to the registry
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-builder:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/Resume-Builder:latest'

options:
  logging: CLOUD_LOGGING_ONLY
