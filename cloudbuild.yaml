steps:
  # Automatically build your Python app using Buildpacks
  - name: 'gcr.io/k8s-skaffold/pack'
    args: ['build', '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$REPO_NAME:$COMMIT_SHA', '--builder', 'gcr.io/buildpacks/builder:v1']

options:
  # This bypasses the service account logging error
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
