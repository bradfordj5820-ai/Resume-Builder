steps:
  # Build using Buildpacks and tag it as 'latest'
  - name: 'gcr.io/k8s-skaffold/pack'
    args: 
      - 'build'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-builder:latest'
      - '--builder'
      - 'gcr.io/buildpacks/builder:v1'

images:
  # This explicitly tells Cloud Build to push the lowercase image to the registry
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-builder:latest'

options:
  logging: CLOUD_LOGGING_ONLY
