steps:
  # Automatically build your Python app using Buildpacks
  - name: 'gcr.io/k8s-skaffold/pack'
    args: ['build', 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/resume-builder:$COMMIT_SHA', '--builder', 'gcr.io/buildpacks/builder:v1']

options:
  # This bypasses the service account logging error
  logging: CLOUD_LOGGING_ONLY
